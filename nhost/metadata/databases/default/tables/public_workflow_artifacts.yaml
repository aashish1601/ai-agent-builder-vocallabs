table:
  name: workflow_artifacts
  schema: public
object_relationships:
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
  - name: run
    using: { foreign_key_constraint_on: workflow_run_id }
  - name: step_run
    using: { foreign_key_constraint_on: step_run_id }
select_permissions:
  - role: user
    permission:
      columns: [id, organization_id, workflow_run_id, step_run_id, key, value, created_at]
      filter:
        organization:
          members:
            user_id: { _eq: X-Hasura-User-Id }
