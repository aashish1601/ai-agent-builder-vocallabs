table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using: { foreign_key_constraint_on: workflow_id }
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
  - name: trigger
    using: { foreign_key_constraint_on: trigger_id }
  - name: starter
    using: { foreign_key_constraint_on: started_by }
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table: { name: step_runs, schema: public }
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, organization_id, trigger_id, trigger_type, status, input, output, error, current_step_key, definition_version, started_by, created_at, started_at, completed_at, updated_at]
      filter:
        organization:
          members:
            user_id: { _eq: X-Hasura-User-Id }
      allow_aggregations: true
