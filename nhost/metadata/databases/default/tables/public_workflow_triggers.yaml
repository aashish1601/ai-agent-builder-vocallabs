table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using: { foreign_key_constraint_on: workflow_id }
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, type, config, enabled, next_run_at, created_at, updated_at]
      filter:
        workflow:
          organization:
            members:
              user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: user
    permission:
      columns: [workflow_id, type, config, enabled, next_run_at]
      check: &trigger_write_check
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _in: [owner, editor] }
          - _or:
              - type: { _neq: webhook }
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: owner }
update_permissions:
  - role: user
    permission:
      columns: [type, config, enabled, next_run_at]
      filter: *trigger_write_check
      check: *trigger_write_check
delete_permissions:
  - role: user
    permission:
      filter: *trigger_write_check
