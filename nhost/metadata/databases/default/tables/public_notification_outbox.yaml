table:
  name: notification_outbox
  schema: public
object_relationships:
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
  - name: run
    using: { foreign_key_constraint_on: workflow_run_id }
  - name: step_run
    using: { foreign_key_constraint_on: step_run_id }
select_permissions:
  - role: user
    permission:
      columns: [id, organization_id, workflow_run_id, step_run_id, channel, destination, payload, status, attempts, delivered_at, error, created_at, updated_at]
      filter:
        organization:
          members:
            user_id: { _eq: X-Hasura-User-Id }
event_triggers:
  - name: deliver_workflow_notification
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: "{{NHOST_FUNCTIONS_URL}}/events/deliver-notification"
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
