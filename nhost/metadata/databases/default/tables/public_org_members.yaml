table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
  - name: user
    using: { foreign_key_constraint_on: user_id }
select_permissions:
  - role: user
    permission:
      columns: [id, organization_id, user_id, role, created_at, updated_at]
      filter:
        organization:
          members:
            user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: user
    permission:
      columns: [organization_id, user_id, role]
      check:
        organization:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
update_permissions:
  - role: user
    permission:
      columns: [role]
      filter: &member_owner_filter
        organization:
          members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      check: *member_owner_filter
delete_permissions:
  - role: user
    permission:
      filter: *member_owner_filter
