[hasura]
version = "v2.48.10-ce"
adminSecret = "{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}"
webhookSecret = "{{ secrets.NHOST_WEBHOOK_SECRET }}"

[[hasura.jwtSecrets]]
type = "HS256"
key = "{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}"

[auth]
version = "0.49.1"

[auth.signUp]
enabled = true

[auth.user.roles]
default = "user"
allowed = ["user", "me"]

[auth.method.emailPassword]
hibpEnabled = false
emailVerificationRequired = false
passwordMinLength = 9

[postgres.resources.storage]
capacity = 1

[observability.grafana]
adminPassword = "{{ secrets.GRAFANA_ADMIN_PASSWORD }}"

[functions]
node.version = 22

[[global.environment]]
name = "DATABASE_URL"
value = "{{ secrets.DATABASE_URL }}"

[[global.environment]]
name = "GROQ_API_KEY"
value = "{{ secrets.GROQ_API_KEY }}"

[[global.environment]]
name = "GROQ_MODEL"
value = "llama-3.1-8b-instant"

[[global.environment]]
name = "APP_BASE_URL"
value = "http://localhost:3000"
